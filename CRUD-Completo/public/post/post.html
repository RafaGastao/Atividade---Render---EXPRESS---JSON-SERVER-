<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>POST - Cadastrar</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header>
        <h1>POST - Create</h1>
        <nav><a href="../index.html">Início</a><a href="../get/get.html">GET</a><a href="../put/put.html">PUT</a><a
                href="../delete/delete.html">DELETE</a></nav>
    </header>
    <main>
        <form id="formCadastro" class="card">
            <h2>Novo registro</h2>
            <div class="grid">
                <div class="campo"><label>Nome</label><input id="nome" required></div>
                <div class="campo"><label>Sobrenome</label><input id="sobrenome" required></div>
                <div class="campo"><label>E-mail</label><input id="email" type="email" required></div>
                <div class="campo"><label>CPF</label><input id="cpf" inputmode="numeric" placeholder="000.000.000-00" required></div>
                <div class="campo"><label>Idade</label><input id="idade" type="number" min="0" required></div>
                <div class="campo"><label>Telefone</label><input id="telefone" required></div>
                <div class="campo"><label>Rua</label><input id="rua" required></div>
                <div class="campo"><label>Bairro</label><input id="bairro" required></div>
                <div class="campo"><label>Cidade</label><input id="cidade" required></div>
                <div class="campo"><label>Estado</label><input id="estado" maxlength="2" placeholder="SP" required>
                </div>
                <div class="campo"><label>RG</label><input id="rg" required></div>
            </div>
            <div class="acoes"><button class="btn" type="submit">Cadastrar</button></div>
            <div id="mensagem" class="msg"></div>
        </form>
    </main>
    <script src="post.js"></script>
</body>

</html>
